<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <div class="board">
        <div data-item="a1" class="cell b r"></div>
        <div data-item="a2" class="cell b r"></div>
        <div data-item="a3" class="cell b"></div>

        <div data-item="b1" class="cell b r"></div>
        <div data-item="b2" class="cell b r"></div>
        <div data-item="b3" class="cell b"></div>

        <div data-item="c1" class="cell r"></div>
        <div data-item="c2" class="cell r"></div>
        <div data-item="c3" class="cell"></div>
    </div>

    <div class="info">
        <div class="info-item">
            <div class="info-title">Current turn:</div>
            <div class="info-body turn">--</div>
        </div>
        <div class="info-item">
            <div class="info-title">Winner:</div>
            <div class="info-body result">--</div>
        </div>
    </div>

    <button class="reset">Reset</button>

    <script src="script.js"></script>
</body>
</html>
